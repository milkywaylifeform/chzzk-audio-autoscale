<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>Chzzk Audio Auto-Scale</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header>
      <h1>Chzzk Audio Auto-Scale</h1>
    </header>

    <section class="status">
      <div class="tab-info">
        <span class="label">현재 탭</span>
        <span id="tab-title" class="value">-</span>
      </div>
      <button id="toggle-btn" class="toggle" disabled>...</button>
    </section>

    <section class="meter">
      <h2>실시간 측정</h2>
      <div class="meter-row">
        <span class="m-label">LUFS</span>
        <span id="meter-lufs" class="m-val">—</span>
      </div>
      <div class="bar lufs-bar">
        <div class="bar-track"></div>
        <div id="bar-gate" class="bar-marker gate" title="Silence Gate"></div>
        <div id="bar-target" class="bar-marker target" title="목표 LUFS"></div>
        <div id="bar-lufs" class="bar-indicator"></div>
      </div>
      <div class="bar-axis">
        <span>-60</span><span>-30</span><span>0 LUFS</span>
      </div>

      <div class="meter-row">
        <span class="m-label">dBFS</span>
        <span id="meter-dbfs" class="m-val">—</span>
      </div>

      <div class="meter-row">
        <span class="m-label">적용 게인</span>
        <span id="meter-gain" class="m-val">—</span>
      </div>
      <div class="bar gain-bar">
        <div class="bar-track"></div>
        <div class="bar-marker zero" title="0 dB"></div>
        <div id="bar-gain" class="bar-indicator gain"></div>
      </div>
      <div class="bar-axis">
        <span id="gain-axis-min">-18</span><span>0</span><span id="gain-axis-max">+18 dB</span>
      </div>

      <div class="meter-row">
        <span class="m-label">상태</span>
        <span id="meter-status" class="m-val">—</span>
      </div>
    </section>

    <hr />

    <section class="settings">
      <h2 id="settings-heading">AGC 설정</h2>

      <div class="slider-row">
        <label for="targetLufs">목표 음량</label>
        <input type="range" id="targetLufs" min="-40" max="-5" step="0.5" />
        <span id="targetLufs-val" class="val"></span>
      </div>

      <div class="slider-row">
        <label for="silenceDbfs">Silence Gate</label>
        <input type="range" id="silenceDbfs" min="-70" max="-25" step="1" />
        <span id="silenceDbfs-val" class="val"></span>
      </div>

      <div class="slider-row">
        <label for="maxGainDb">최대 증폭</label>
        <input type="range" id="maxGainDb" min="6" max="24" step="1" />
        <span id="maxGainDb-val" class="val"></span>
      </div>

      <div class="slider-row">
        <label for="attackS">Attack</label>
        <input type="range" id="attackS" min="0.05" max="1" step="0.05" />
        <span id="attackS-val" class="val"></span>
      </div>

      <div class="slider-row">
        <label for="releaseS">Release</label>
        <input type="range" id="releaseS" min="0.5" max="10" step="0.5" />
        <span id="releaseS-val" class="val"></span>
      </div>

      <button id="reset-btn" class="reset">기본값 복원</button>
    </section>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
